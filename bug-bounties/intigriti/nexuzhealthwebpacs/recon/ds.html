<!DOCTYPE html>
<html>
<head>
	<title>Nexuzhealth</title>
	<meta property="og:title" content="Mynexuzhealth">
	<meta property="og:site_name" content="Mynexuzhealth">
	<meta name="description" content="Nexuzhealth verbindt patiënten, zorginstellingen én zorgprofessionals via één centraal elektronisch patiëntendossier. ">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/font-awesome.min.css">
    <link rel="stylesheet" href="css/nexuzhealth.css">
</head>
<body>
<nav class="navbar navbar-toggleable-sm navbar-light bg-faded">
    <button class="navbar-toggler navbar-toggler-right" type="button" data-toggle="collapse"
            data-target="#navbarCollapse" aria-controls="navbarCollapse" aria-expanded="false">
        <span class="navbar-toggler-icon"></span>
    </button>
    <a class="navbar-brand" id="home" href="https://nexuzhealth.com/">
        <img id="logo" src="img/nexuzhealth.png"/>
    </a>
    <div class="collapse navbar-collapse justify-content-end" id="navbarCollapse">
        <ul class="navbar-nav">
            <li class="nav-item">
                <a class="nav-link" href="#" onclick="switcher('nl')"><span id="nl"
                                                                            class="badge badge-pill badge-default">NL</span></a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#" onclick="switcher('fr')"><span id="fr"
                                                                            class="badge badge-pill badge-default">FR</span></a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#" onclick="switcher('en')"><span id="en"
                                                                            class="badge badge-pill badge-default">EN</span></a>
            </li>
        </ul>
    </div>
</nav>
<div class="container">
    <div id="welcome"></div>
    <div class="card-group" id="container"></div>
</div>
<footer class="footer">
    <div id="footer" class="container text-center"></div>
</footer>
<script id="template" type="text/x-handlebars-template">
    {{#each entries}}
		<p id="returnUrl{{id}}" style="display:none;">
			{{url}}
		</p>
		{{#if (equals ../entries.length 2)}}
			{{#if resources.hide}}
				<div class="mt-3 text-center">
					{{#if rememberme}}
					<label class="custom-control custom-checkbox">
						<input type="checkbox" class="custom-control-input" id="rememberme{{@index}}">
						<span class="custom-control-indicator"></span>
						<span class="custom-control-description">{{t 'rememberme'}}</span>
					</label>
					<br/>
					{{/if}}
					<button type="button" class="btn btn-link"
									onclick="follow('{{id}}', '{{entityID}}','{{authnContextClassRef}}',{{#if rememberme}}false{{else}}true{{/if}},$('#rememberme{{@index}}').is(':checked'))">
						{{resources.title}}
					</button>
				</div>
		  {{else}}
				<div class="card">
			<div class="text-center">
				<img class="card-img-top card-logo"
						 onclick="follow('{{id}}', '{{entityID}}','{{authnContextClassRef}}',{{#if rememberme}}false{{else}}true{{/if}},$('#rememberme{{@index}}').is(':checked'))"
						 src="{{resources.logo}}" alt="{{{resources.title}}}">
			</div>
			<div class="card-block">
				<div class="card-title">
					{{{resources.title}}}
				</div>
				{{#if resources.info}}
				<p class="card-text">{{{resources.info}}}</p>
				{{/if}}
			</div>
			<ul class="list-group list-group-flush" id="links{{@index}}">
				{{#each resources.links}}
				<li class="list-group-item"><a href="{{url}}">{{{anchor}}}</a></li>
				{{/each}}
			</ul>
			<div class="card-footer text-center">
				{{#if rememberme}}
				<label class="custom-control custom-checkbox">
					<input type="checkbox" class="custom-control-input" id="rememberme{{@index}}">
					<span class="custom-control-indicator"></span>
					<span class="custom-control-description">{{t 'rememberme'}}</span>
				</label>
				<br/>
				{{/if}}
				<button type="button" class="btn btn-primary"
								onclick="follow('{{id}}', '{{entityID}}','{{authnContextClassRef}}',{{#if rememberme}}false{{else}}true{{/if}},$('#rememberme{{@index}}').is(':checked'))">
					{{t 'login'}}
				</button>
			</div>
		</div>
			{{/if}}
		{{else}}
			<div class="card">
			<div class="text-center">
                <img class="card-img-top card-logo"
                     onclick="follow('{{id}}', '{{entityID}}','{{authnContextClassRef}}',{{#if rememberme}}false{{else}}true{{/if}},$('#rememberme{{@index}}').is(':checked'))"
                     src="{{resources.logo}}" alt="{{{resources.title}}}">
			</div>
			<div class="card-block">
				<div class="card-title">
					{{{resources.title}}}
				</div>
				{{#if resources.info}}
				<p class="card-text">{{{resources.info}}}</p>
				{{/if}}
			</div>
			<ul class="list-group list-group-flush" id="links{{@index}}">
				{{#each resources.links}}
				<li class="list-group-item"><a href="{{url}}">{{{anchor}}}</a></li>
				{{/each}}
			</ul>
			<div class="card-footer text-center">
				{{#if rememberme}}
				<label class="custom-control custom-checkbox">
					<input type="checkbox" class="custom-control-input" id="rememberme{{@index}}">
					<span class="custom-control-indicator"></span>
					<span class="custom-control-description">{{t 'rememberme'}}</span>
				</label>
				<br/>
				{{/if}}
				<button type="button" class="btn btn-primary"
						onclick="follow('{{id}}', '{{entityID}}','{{authnContextClassRef}}',{{#if rememberme}}false{{else}}true{{/if}},$('#rememberme{{@index}}').is(':checked'))">
					{{t 'login'}}
				</button>
			</div>
		</div>
		{{/if}}
    {{/each}}
</script>
<script>
    if (document.all && !window.atob) { //IE9 or older - maar geen unsupported pagina meer.
        redirect("https://nexuzhealth.com/nl/veelgestelde-vragen/");
    }
</script>
<script type="text/javascript" src="js/jquery.min.js"></script>
<script type="text/javascript" src="js/jquery.cookie.js"></script>
<script type="text/javascript" src="js/jquery.urlparam.js"></script>
<script type="text/javascript" src="js/tether.min.js"></script>
<script type="text/javascript" src="js/bootstrap.min.js"></script>
<script type="text/javascript" src="js/handlebars.js"></script>
<script type="text/javascript" src="js/i18next.min.js"></script>
<script type="text/javascript" src="js/ofi.min.js"></script>
<script type="text/javascript" src="js/validator.min.js"></script>
<script>
    function switcher(lang) {
        $("#nl,#fr,#en").removeClass("badge-primary");
        $("#" + lang).addClass("badge-primary");
/*        $.cookie("nexuzLang", lang, {
            expires: new Date(8640000000000000),
            path: "/",
            domain: "." + location.hostname.split('.').slice(-2).join('.'),
            secure: true
        });*/
        i18n.setLng(lang, function (err, t) {
            $(document).attr("title", t("title"));
            $("#footer").html("<a href='" + t("policy") + "'>" + t("cookies") + "</a>");
            var my = window.location.host.match(/^my|mijn/i);
            if (my) {
                $("#home").attr("href", t("my.url"));
                $("#logo").attr("src", "img/mynexuzhealth.png");
                $("#welcome").html("<a class='welcome' href='" + t("my.url") + "'>" + t("my.welcome") + "</a>");
            }
            var pro = window.location.host.match(/pro[.]/i)
            if (pro) {
                my = false;
				$('meta[property="og:title"]').remove();
				$('head').append('<meta property="og:title" content="Nexuzhealth Consult">');
				$('meta[property="og:site_name"]').remove();
				$('head').append('<meta property="og:site_name" content="Nexuzhealth Consult">');
                $("#home").attr("href", t("pro.url"));
                $("#logo").attr("src", "img/nexuzhealthconsult.png");
                $("#welcome").html("<a class='welcome' href='" + t("pro.url") + "'>" + t("pro.welcome") + "</a>");
            }
            var request = $.ajax({
                url: "/Shibboleth.sso/DiscoFeed",
                method: "GET",
                dataType: "json"
            });
            request.done(function (entries) {
                for (var i = entries.length - 1; i >= 0; i--) {
                    entries[i].url = $.urlParam("return");
                    entries[i].authnContextClassRef = "";
                    entries[i].rememberme = entries[i].url.match(/media.+dicom/i);
                    if (entries[i].entityID.match(/ehealth|smals/i)) {
						entries[i].id = "ehealth";
                        entries[i].resources = i18n.t(entries[i].id, {returnObjectTrees: true});
                    }
                    if (entries[i].entityID.match(/e-contract|dana/i)) {
						entries[i].id = "eid";
                        entries[i].resources = i18n.t(entries[i].id, {returnObjectTrees: true});
                    }
                    if (entries[i].entityID.match(/adfs/i)) {
                        entries[i].id = "adfs";
						entries[i].resources = i18n.t(entries[i].id, {returnObjectTrees: true});
                    }
                    if (entries[i].entityID.match(/hcsso/i)) {
                        entries[i].id = "hector";
						entries[i].resources = i18n.t(entries[i].id, {returnObjectTrees: true});
                    }
                    if (entries[i].entityID.match(/myuz|code|token/i)) {
                        entries[i].id = "code";
						entries[i].resources = i18n.t(entries[i].id, {returnObjectTrees: true});
                    }
                    if (entries[i].entityID.match(/nexuzhealth[.]pro/i)) {
						entries[i].id = "auth0";
						entries[i].resources = i18n.t(entries[i].id, {returnObjectTrees: true});
						if ($.urlParam("referer", $.urlParam("target", $.urlParam("return"))) == "moapr") {
							var location = entries[i].url;
                            location += "&entityID=" + encodeURIComponent(entries[i].entityID);
							redirect(location);
						} else {
                            entries.splice(i, 1);
							continue;
                        }
                    }
                    if (entries[i].entityID.match(/contact/i)) {
                        entries[i].rememberme = false;
                        if (entries[i].url.match(/media.+dicom/i)) {
                            entries[i].entityID = "";
                            entries[i].url = $.urlParam("target", $.urlParam("return")).replace(/\/dicom\/(.+)$/i, "/patient?code=$1");
                            entries[i].url = entries[i].url.replace(/\/dicom$/i, "/patient");
                        }
                        entries[i].id = "contact";
						entries[i].resources = i18n.t(entries[i].id, {returnObjectTrees: true});
                    }
                    if (entries[i].entityID.match(/iamfas/i)) {
                        entries[i].id = "csam";
						entries[i].resources = i18n.t(entries[i].id, {returnObjectTrees: true});
                        entries[i].authnContextClassRef = "urn:be:fedict:iam:fas:citizen:eid urn:be:fedict:iam:fas:citizen:totp";
						if (entries[i].url.match(/itsme/i)) {
							var location = entries[i].url;
                            location += "&entityID=" + encodeURIComponent(entries[i].entityID);
							location += "&authnContextClassRef=" + encodeURIComponent("urn:be:fedict:iam:fas:citizen:Level450");
                            redirect(location);
						}
						if (document.referrer.match(/(mijngezondheid|masante|myhealth)[.](belgie|belgique|belgium)[.]be/i)) {
							var location = entries[i].url;
                            location += "&entityID=" + encodeURIComponent(entries[i].entityID);
							location += "&authnContextClassRef=" + encodeURIComponent("urn:be:fedict:iam:fas:citizen:Level400");
                            redirect(location);
						}
                    }
                    if (entries[i].entityID.match(/cookie/i)) {
                        if ($.cookie("nexuzCookie") && entries[i].rememberme) {
                            var location = entries[i].url;
                            location += "&entityID=" + encodeURIComponent(entries[i].entityID);
                            redirect(location);
                        } else {
                            entries.splice(i, 1);
							continue;
                        }
                    }
                    if (my && entries[i].resources && entries[i].resources.my) {
                        entries[i].resources.links = entries[i].resources.my.concat(entries[i].resources.links);
                    }
                    if (pro && entries[i].resources && entries[i].resources.pro) {
                        entries[i].resources.links = entries[i].resources.pro.concat(entries[i].resources.links);
                    }
                }
                var source = $("#template").html();
                var template = Handlebars.compile(source);
                var html = template({entries: entries.reverse(), login: t("login")});
								var blockLayout = ((pro||my) && entries.length == 2) ? "d-block" : ""; //if codekaarte block is hidden
                $("#container").addClass(blockLayout).html(html);
            });
        });
    }

    function add(url, parameter, key, value) {
        var uri = $.urlParam(parameter, url)
        if (uri) {
            if (uri.indexOf("?") == -1) {
                return url.replace(encodeURIComponent(uri), encodeURIComponent(uri + "?" + key + "=" + encodeURIComponent(value)));
            } else {
                return url.replace(encodeURIComponent(uri), encodeURIComponent(uri + "&" + key + "=" + encodeURIComponent(value)));
            }
        } else {
            if (url.indexOf("?") == -1) {
                return url + "?" + key + "=" + encodeURIComponent(value);
            } else {
                return url + "&" + key + "=" + encodeURIComponent(value);
            }
        }
    }

    function follow(id, entityID, authnContextClassRef, lang, rememberme) {
        var url = document.getElementById("returnUrl"+id).innerText.trim();
        var location = url;
        if (lang) {
            location = add(location, "target", "nexuzLang", lang);
        }
        if (rememberme) {
            location = add(location, "target", "rememberme", "nexuzCookie");
        }
        if (authnContextClassRef != "") {
            location = add(location, "bogus", "authnContextClassRef", authnContextClassRef);
        }
        if (entityID != "") {
            location = add(location, "bogus", "entityID", entityID);
        }
        redirect(location);
    }

    function redirect(url) {
        var pattern = new RegExp('^(https?:\\/\\/)?' + // protocol
            '((([a-z\\d]([a-z\\d-]*[a-z\\d])*)\\.?)+[a-z]{2,}|' + // domain name
            '((\\d{1,3}\\.){3}\\d{1,3}))' + // OR ip (v4) address
            '(\\:\\d+)?(\\/[-a-z\\d%_.~+]*)*' + // port and path
            '(\\?[;&a-z\\d%_.~+=-]*)?' + // query string
            '(\\#[-a-z\\d_]*)?$', 'i'); // fragment locator
        if (pattern.test(url) && isAllowedUrl(url)) {
            window.location = url;
        } else {
            console.error("Invalid redirect url " + url + "  given - url does not match pattern or is not allowed")
        }
    }

    function isAllowedUrl(url) {
		try {
			// parse url and normalize to ASCII/punycode
			const u = new URL(url, window.location.origin)
			const host = u.hostname.toLowerCase();
			if(u.protocol !== 'https:') return false;
			// allowed host check
			const allowed = ['mynexuz.be', 'uzleuven.be', 'uz.kuleuven.ac.be',
				'nexuzhealth.net', 'nexuzhealth.be', 'nexuzhealth.com',
				'mynexuzhealth.be', 'mynexuzpro.be','mynexuzhealthpro.be'];
			return allowed.some(d => host === d
					|| host.endsWith('.'+d));
		}
		catch {
			return false;
		}
    }

    $(document).ready(function () {
        Handlebars.registerHelper('t', function (key) {
            return i18n.t(key);
        });
				Handlebars.registerHelper('equals', function(arg1, arg2) {
					return arg1 == arg2;
				});
        i18n.init({
            useCookie: false,
            lngWhitelist: ["nl", "fr", "en"],
            fallbackLng: "en"
        }, function (err, t) {
            // switcher(($.cookie("nexuzLang")) ? $.cookie("nexuzLang") : navigator.language || navigator.userLanguage);
            switcher(navigator.language || navigator.userLanguage);
        });
        objectFitImages();
    });
</script>
</body>
</html>
