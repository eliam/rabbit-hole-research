<script nonce="100db4e34aec34b02be42006b1100505">
/**
 * Consolidated JavaScript for LoginPage.thtml - CSP Compliant
 * All inline scripts moved here to comply with strict CSP
 */

// Global functions that were previously inline
function close_snackbar() {
    var snackbar = document.getElementsByClassName('brcd-snackbar')[0];
    if (snackbar) {
        snackbar.style.display = "none";
    }
}

function hideJSWarn() {
    if (window.top === self) {
        var noJSWarn = document.getElementById('noJSWarn');
        if (noJSWarn) {
            noJSWarn.style.display = "none";
        }
    }
}

function deletepreauth() {
    document.cookie = "DSPREAUTH=" + escape("") + ";path=/dana-na/;expires=12-Nov-1996";
}

function handleFrameBusting() {
    // Prevent page from being loaded in frames
    if (window.top !== self) {
        top.location = location;
    }
    
    // Close window if it's a cancel window
    if (window.name === "newpincancel" || window.name === "nexttokencancel") {
        window.close();
    }
}

function setupPreAuthTimeout() {}

function setupEUPStyling() {
    // Background and color management for EUP interface
    var getSignInLeftContainer = document.querySelector('.signin-left-container_eup');
    var getHeaderTitle = document.getElementsByClassName('signin-left-header-title_eup');
    
    if (getSignInLeftContainer && getHeaderTitle.length > 0) {
        if (!0) {
            getSignInLeftContainer.style.backgroundImage = 'none';
            getSignInLeftContainer.style.backgroundColor = "\x23FFFFFF";
            getHeaderTitle[0].style.color = '#303540';
            if (getHeaderTitle[1]) {
                getHeaderTitle[1].style.color = '#303540';
            }
        } else {
            getSignInLeftContainer.style.backgroundImage = "url('/dana-na/imgs/eup_bg.png')";
            getSignInLeftContainer.style.backgroundColor = 'none';
            getHeaderTitle[0].style.color = '#FFFFFF';
            if (getHeaderTitle[1]) {
                getHeaderTitle[1].style.color = '#FFFFFF';
            }
        }
    }
    
    // Password show/hide toggle
    var getEyeIcons = document.querySelectorAll('.signin-right-eye-icon_eup');
    var getPasswordFields = document.querySelectorAll('.signin-password-field_eup');
    
    getEyeIcons.forEach(function(getEyeIcon, index) {
        getEyeIcon.addEventListener('click', function() {
            var getPasswordField = getPasswordFields[index];
            if (getPasswordField && getPasswordField.value.length > 0) {
                if (getPasswordField.type === 'password') {
                    getPasswordField.type = 'text';
                } else {
                    getPasswordField.type = 'password';
                }
            }
        });
    });
}

function setupEventListeners() {
    // Setup form submit listeners
    var forms = document.querySelectorAll('form[name="frmLogin"]');
    forms.forEach(function(form) {
        form.addEventListener('submit', function(e) {
            var setcookies = this.getAttribute('data-setcookies');
            if (typeof Login === 'function') {
                var result = Login(setcookies);
                if (!result) {
                    e.preventDefault();
                    return false;
                }
            }
        });
    });
    
    // Setup help button listeners
    var helpButtons = document.querySelectorAll('.help-button');
    helpButtons.forEach(function(button) {
        button.addEventListener('click', function(e) {
            e.preventDefault();
            var helpUrl = this.getAttribute('data-help-url') || 'welcome.cgi?p=help';
            window.open(helpUrl, "wndHelp", "height=400,width=500,resizeable=yes,scrollbars=yes");
            return false;
        });
    });
    
    // Setup snackbar dismiss listeners
    var dismissButtons = document.querySelectorAll('.snackbar-dismiss');
    dismissButtons.forEach(function(button) {
        button.addEventListener('click', function(e) {
            e.preventDefault();
            close_snackbar();
        });
    });
}

function initLoginPage() {
    // Initialize CSS if WriteCSS function exists
    if (typeof WriteCSS === 'function') {
        WriteCSS();
    }
    
    // Handle frame busting
    handleFrameBusting();
    
    // Hide JavaScript warning
    hideJSWarn();
    
    // Setup preauth timeout
    setupPreAuthTimeout();
    
    // Setup EUP styling if EUP elements exist
    if (document.querySelector('.signin-left-container_eup')) {
        setupEUPStyling();
    }
    
    // Setup all event listeners
    setupEventListeners();
    
    // Call original FinishLoad if it exists
    if (typeof FinishLoad === 'function') {
        FinishLoad(0);
    }
}

// Initialize when DOM is ready
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initLoginPage);
} else {
    initLoginPage();
}
</script>
