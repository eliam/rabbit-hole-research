<script nonce="" defer > 
  // To Show the background Image / backgroundColor based on the condition
  const getSignInLeftContainer = document.querySelector('.signin-left-container_eup')
  const getHeaderTitle = document.getElementsByClassName('signin-left-header-title_eup')
  if(!0) { 
      getSignInLeftContainer.style.backgroundImage = 'none'
      getSignInLeftContainer.style.backgroundColor = "\x23FFFFFF"
      getHeaderTitle[0].style.color = '#303540'
      getHeaderTitle[1].style.color = '#303540'
  }
  else{
      getSignInLeftContainer.style.backgroundImage = "url('/dana-na/imgs/eup_bg.png')"
      getSignInLeftContainer.style.backgroundColor = 'none'
      getHeaderTitle[0].style.color = '#FFFFFF'
      getHeaderTitle[1].style.color = '#FFFFFF'
  }
  // To handle the show / hide password 
  const getEyeIcons = document.querySelectorAll('.signin-right-eye-icon_eup')
  const getPasswordFields = document.querySelectorAll('.signin-password-field_eup')
  
  getEyeIcons.forEach((getEyeIcon, index) => {
    getEyeIcon.addEventListener('click', () => {
      let getPasswordField = getPasswordFields[index];
      if(getPasswordField.value.length > 0){
        if(getPasswordField.type === 'password'){
          getPasswordField.type = 'text'
        }
        else{
          getPasswordField.type = 'password'
        }
      }
    })
  })
</script>
